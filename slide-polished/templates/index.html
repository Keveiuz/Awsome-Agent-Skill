<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{演示标题}</title>
  <style>
    :root {
      --bg: #f0f4f8; --cyan: #0284c7; --text: #1e293b;
      --text-dim: rgba(30,41,59,0.65); --text-faint: rgba(30,41,59,0.38);
      --font-sans: 'PingFang SC','Microsoft YaHei','SF Pro Display','Segoe UI',sans-serif;
      --font-mono: 'SF Mono','JetBrains Mono',Consolas,monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-sans); }

    #viewer { width: 100vw; height: calc(100vh - 52px); position: relative; }
    #slideFrame { width: 100%; height: 100%; border: none; display: block; transition: opacity 0.18s ease, transform 0.18s ease; }

    #controls {
      position: fixed; bottom: 0; left: 0; right: 0; height: 52px;
      background: rgba(248,250,252,0.97); border-top: 1px solid rgba(0,0,0,0.08);
      display: flex; align-items: center; justify-content: center; gap: 2vw;
      z-index: 100; box-shadow: 0 -1px 8px rgba(0,0,0,0.06);
    }
    .ctrl-btn {
      background: rgba(255,255,255,0.8); border: 1px solid rgba(0,0,0,0.12);
      color: var(--text-dim); padding: 6px 18px; border-radius: 8px;
      font-size: 14px; cursor: pointer; font-family: var(--font-sans); transition: all 0.2s;
    }
    .ctrl-btn:hover { background: rgba(2,132,199,0.08); color: var(--cyan); border-color: rgba(2,132,199,0.3); }
    .ctrl-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    #slide-counter { font-family: var(--font-mono); font-size: 14px; color: var(--text-faint); min-width: 60px; text-align: center; }
    #slide-title-bar { font-size: 13px; color: var(--text-dim); max-width: 38vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    #thumb-panel {
      position: fixed; left: 0; top: 0; bottom: 52px; width: 260px;
      background: rgba(248,250,252,0.98); border-right: 1px solid rgba(2,132,199,0.15);
      overflow-y: auto; transform: translateX(-100%); transition: transform 0.3s ease;
      z-index: 99; padding: 14px 8px; box-shadow: 2px 0 16px rgba(0,0,0,0.08);
    }
    #thumb-panel.open { transform: translateX(0); }
    #thumb-panel::-webkit-scrollbar { width: 4px; }
    #thumb-panel::-webkit-scrollbar-thumb { background: rgba(2,132,199,0.25); border-radius: 2px; }

    .thumb-header { font-size: 11px; letter-spacing: 0.12em; color: rgba(2,132,199,0.7); text-transform: uppercase; padding: 2px 10px 10px; border-bottom: 1px solid rgba(0,0,0,0.07); margin-bottom: 8px; font-weight: 600; }
    .thumb-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border-radius: 7px; cursor: pointer; font-size: 12.5px; color: var(--text-dim); transition: all 0.15s; margin-bottom: 1px; line-height: 1.5; }
    .thumb-item:hover { background: rgba(2,132,199,0.06); color: var(--text); }
    .thumb-item.active { background: rgba(2,132,199,0.08); color: var(--cyan); border-left: 2px solid var(--cyan); padding-left: 8px; font-weight: 600; }
    .thumb-num { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); min-width: 22px; flex-shrink: 0; padding-top: 1px; }
    .thumb-item.active .thumb-num { color: rgba(2,132,199,0.8); }

    #hint {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      background: rgba(255,255,255,0.97); border: 1px solid rgba(2,132,199,0.2);
      border-radius: 12px; padding: 22px 36px; text-align: center;
      font-size: 14px; color: var(--text-dim); line-height: 2.3;
      z-index: 200; display: none; box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    }
    #hint.show { display: block; }
    #hint kbd { background: rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.12); border-radius: 5px; padding: 2px 8px; font-family: var(--font-mono); font-size: 12px; color: var(--cyan); }
  </style>
</head>
<body>
  <div id="viewer">
    <iframe id="slideFrame" src="slides/00-cover.html"></iframe>
  </div>

  <div id="thumb-panel">
    <div class="thumb-header">目录 · 共 N 页</div>
    <!-- filled by JS -->
  </div>

  <div id="controls">
    <button class="ctrl-btn" id="btn-thumb" title="目录 (T)">☰ 目录</button>
    <button class="ctrl-btn" id="btn-prev" title="上一页 (←)">← 上一页</button>
    <span id="slide-counter">1 / N</span>
    <button class="ctrl-btn" id="btn-next" title="下一页 (→)">下一页 →</button>
    <button class="ctrl-btn" id="btn-fullscreen" title="全屏 (F)">⛶ 全屏</button>
    <span id="slide-title-bar"></span>
  </div>

  <div id="hint">
    <div style="color:var(--cyan);font-weight:600;font-size:15px;margin-bottom:10px;">键盘快捷键</div>
    <kbd>←</kbd> / <kbd>→</kbd>&nbsp; 上下页<br>
    <kbd>Home</kbd> / <kbd>End</kbd>&nbsp; 首末页<br>
    <kbd>T</kbd>&nbsp; 切换目录面板<br>
    <kbd>F</kbd>&nbsp; 全屏<br>
    <kbd>?</kbd>&nbsp; 显示 / 隐藏此帮助
  </div>

  <script src="js/main.js"></script>
</body>
</html>
