<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>{标题}</title>
  <link rel="stylesheet" href="../../css/style.css">
  <!-- dark/style.css 覆盖亮色变量 -->
  <link rel="stylesheet" href="./style.css">
  <style>
    .cover-bg {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 50%, rgba(0,212,255,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 50% 60% at 80% 50%, rgba(124,58,237,0.08) 0%, transparent 70%),
        #000;
    }
    .cover-center {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100%; text-align: center;
      position: relative; z-index: 2;
      gap: 0;
    }
    .cover-eyebrow {
      font-size: clamp(11px, 1vw, 18px);
      letter-spacing: 0.3em; color: rgba(0,212,255,0.7);
      text-transform: uppercase; margin-bottom: 2.5vh;
      animation: fadeIn 0.8s ease both;
    }
    .cover-title {
      font-size: clamp(36px, 5.5vw, 72px);
      font-weight: 800; color: #fff;
      line-height: 1.15; letter-spacing: -0.01em;
      animation: scaleIn 0.8s ease 0.2s both;
    }
    .cover-title .neon-word {
      color: var(--neon-cyan);
      text-shadow: 0 0 20px rgba(0,212,255,0.6), 0 0 40px rgba(0,212,255,0.3);
    }
    .cover-divider {
      width: 8vw; height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
      box-shadow: 0 0 10px rgba(0,212,255,0.5);
      margin: 2.5vh 0;
      animation: fadeIn 0.8s ease 0.5s both;
    }
    .cover-subtitle {
      font-size: clamp(16px, 2vw, 36px);
      color: rgba(255,255,255,0.75); font-weight: 300;
      letter-spacing: 0.06em;
      animation: slideInUp 0.8s ease 0.6s both;
    }
    .cover-tags {
      display: flex; gap: 1vw; flex-wrap: wrap; justify-content: center;
      margin-top: 3vh; animation: fadeIn 0.8s ease 0.9s both;
    }
    .cover-meta {
      position: absolute; bottom: 3vh; right: 4vw;
      font-size: clamp(10px, 0.9vw, 14px);
      color: rgba(255,255,255,0.25); text-align: right;
      letter-spacing: 0.05em; animation: fadeIn 0.8s ease 1.2s both;
    }
    /* 角点装饰 */
    .corner { position: absolute; width: 40px; height: 40px; }
    .corner.tl { top: 3vh; left: 3vw; border-top: 2px solid rgba(0,212,255,0.5); border-left: 2px solid rgba(0,212,255,0.5); }
    .corner.tr { top: 3vh; right: 3vw; border-top: 2px solid rgba(0,212,255,0.5); border-right: 2px solid rgba(0,212,255,0.5); }
    .corner.bl { bottom: 3vh; left: 3vw; border-bottom: 2px solid rgba(0,212,255,0.5); border-left: 2px solid rgba(0,212,255,0.5); }
    .corner.br { bottom: 3vh; right: 3vw; border-bottom: 2px solid rgba(0,212,255,0.5); border-right: 2px solid rgba(0,212,255,0.5); }
  </style>
</head>
<body>
  <div class="slide" style="padding:0; justify-content:center; align-items:center;">
    <div class="cover-bg"></div>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="cover-center">
      <div class="cover-eyebrow">{英文副标题/分类}</div>
      <div class="cover-title">
        <span class="neon-word">{主标题英文/强调词}</span><br>
        {主标题中文}
      </div>
      <div class="cover-divider"></div>
      <div class="cover-subtitle">{副标题：从XX看XX的XX}</div>
      <div class="cover-tags">
        <span class="badge cyan">{关键词1}</span>
        <span class="badge purple">{关键词2}</span>
        <span class="badge gold">{关键词3}</span>
        <span class="badge green">{关键词4}</span>
        <span class="badge red">{关键词5}</span>
        <!-- 3–6 个 badge -->
      </div>
    </div>
    <div class="cover-meta">{主题} &nbsp;·&nbsp; {时长} min</div>
    <div class="page-indicator">1 / N</div>
  </div>
</body>
</html>
